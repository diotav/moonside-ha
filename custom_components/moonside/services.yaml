set_theme:
  target:
    entity:
      domain: light
      integration: moonside
  fields:
    theme:
      required: true
      example: GRADIENT1
      selector:
        select:
          custom_value: true
          options:
            - RAINBOW1
            - RAINBOW2
            - RAINBOW3
            - FIRE1
            - FIRE2
            - THEME1
            - THEME2
            - THEME3
            - THEME4
            - THEME5
            - COLORDROP1
            - GRADIENT1
            - GRADIENT2
            - GRADIENT3
            - TWINKLE1
            - PULSING1
            - PALETTE1
            - PALETTE2
            - BEAT1
            - BEAT2
            - BEAT3
            - WAVE1
            - LAVA1
            - M1
            - M2
            - M3
            - M4
            - M5
            - M6
            - M7
            - M8
            - M9
            - M10
            - M11
            - M12
    color:
      selector:
        color_rgb:
    color2:
      selector:
        color_rgb:
    color3:
      selector:
        color_rgb:
    color4:
      selector:
        color_rgb:
    color5:
      selector:
        color_rgb:
    color6:
      selector:
        color_rgb:
    speed:
      selector:
        number:
          min: 0
          max: 255
          mode: box

set_pixel:
  target:
    entity:
      domain: light
      integration: moonside
  fields:
    index:
      required: true
      example: 42
      selector:
        number:
          min: 0
          max: 171
          mode: box
    color:
      required: true
      selector:
        color_rgb:

set_backled:
  target:
    entity:
      domain: light
      integration: moonside
  fields:
    section:
      required: true
      example: 1
      selector:
        select:
          options:
            - "1"
            - "2"
    color:
      required: true
      selector:
        color_rgb:

send_command:
  target:
    entity:
      domain: light
      integration: moonside
  fields:
    command:
      required: true
      example: "THEME.GRADIENT1.255,0,0,128,0,255,"
      selector:
        text:
